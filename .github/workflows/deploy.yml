name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Lint, типы и тесты идут параллельно и не держат деплой: красный — сигнал, не стоп
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env: { POSTGRES_USER: dope, POSTGRES_PASSWORD: dope_ci, POSTGRES_DB: dope_lyrics }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U dope" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dope:dope_ci@localhost:5432/dope_lyrics
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - name: server
        working-directory: server
        run: bun install --frozen-lockfile && bun run generate && bun run migrate && bun run check && bun test
      - name: client
        if: ${{ !cancelled() }}
        working-directory: client
        run: bun install --frozen-lockfile && bun run check

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.f.outputs.frontend == 'true' }}
      nginx: ${{ steps.f.outputs.nginx == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend: ['server/**', 'docker-compose.prod*.yml']
            frontend: ['client/**', 'docker-compose.prod*.yml']
            nginx: ['nginx.prod.conf']

  build:
    name: build ${{ matrix.service }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dir: server
          - service: frontend
            dir: client
            args: |
              NEXT_PUBLIC_BASE_PATH=/essence
              BASE_URL=http://backend:4000
              NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME || 'dope_lyrics_bot' }}
    steps:
      - uses: docker/login-action@v3
        if: needs.changes.outputs[matrix.service] == 'true'
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs[matrix.service] == 'true'
      - uses: docker/build-push-action@v6
        if: needs.changes.outputs[matrix.service] == 'true'
        with:
          context: '{{defaultContext}}:${{ matrix.dir }}'
          target: release
          push: true
          build-args: ${{ matrix.args }}
          tags: |
            ghcr.io/kam1kazy/dope-lyrics-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/kam1kazy/dope-lyrics-${{ matrix.service }}:latest
          labels: org.opencontainers.image.source=https://github.com/kam1kazy/dope-lyrics
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=min

  deploy:
    needs: [changes, build]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.nginx == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Выкатка, бэкап и чистка на сервере
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}
          DEPLOY_NGINX: ${{ needs.changes.outputs.nginx }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          envs: DEPLOY_SHA,DEPLOY_BACKEND,DEPLOY_FRONTEND,DEPLOY_NGINX,GHCR_USER,GHCR_TOKEN
          script: |
            cd /opt/dope-lyrics && git fetch -q origin main && git merge --ff-only -q "$DEPLOY_SHA"
            bash scripts/deploy/deploy-prod.sh

      - name: Проверка снаружи
        run: |
          site=https://legoblokk.ru/essence
          expect() {
            for _ in $(seq 20); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${@:3}" "$2")" = "$1" ] && { echo "ok $1 $2"; return; }
              sleep 3
            done
            echo "::error::$2 — ждали $1"; return 1
          }
          expect 200 "$site" -L
          expect 401 "$site/auth/me"
          expect 401 "$site/graphql" -X POST -H 'content-type: application/json' --data '{"query":"{__typename}"}'
          expect 403 "$site/auth/telegram-webapp" -X POST -H 'content-type: text/plain' --data '{}'
