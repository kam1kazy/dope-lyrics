name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Variables
        run: |
          echo "=== Debug Info ==="
          echo "Environment variables:"
          echo "DOCKER_HUB_USERNAME: '${{ vars.DOCKER_HUB_USERNAME }}'"
          echo "Repository variables:"
          echo "DOCKER_HUB_TOKEN exists: '${{ secrets.DOCKER_HUB_TOKEN != '' }}'"

      - name: Verify Docker Login
        run: |
          echo "Testing Docker Hub connection..."
          docker login -u ${{ vars.DOCKER_HUB_USERNAME }} --password-stdin <<< "${{ secrets.DOCKER_HUB_TOKEN }}"
          echo "Docker login successful"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          target: release
          push: true
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/dope-lyrics-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          target: release
          push: true
          tags: ${{ vars.DOCKER_HUB_USERNAME }}/dope-lyrics-frontend:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          script: |
            echo "Testing connection..."
            whoami
            pwd
            cd /root/project
            ls -la
            echo "Starting deployment..."
            docker-compose pull
            docker-compose up -d
