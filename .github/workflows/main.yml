name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug Variables
        run: |
          echo "Checking environment..."
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Available variables:"
          env
          echo "Docker Hub Username: ${{ vars.DOCKERHUB_USERNAME }}"
          echo "Has Docker Hub Token: ${{ secrets.DOCKER_HUB_TOKEN != '' }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          target: release
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/dope-essence-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          target: release
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/dope-essence-frontend:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/project
            docker-compose pull
            docker-compose up -d

      - name: Debug GitHub Secrets
        run: |
          echo "Username: ${{ secrets.DOCKER_HUB_USERNAME }}"
          echo "Token Length: $(echo -n "${{ secrets.DOCKER_HUB_TOKEN }}" | wc -c)"
