resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    # 443 включаем, когда порт освободится от Marzban:
    # снять комментарии здесь и добавить '443:443' в docker-compose.prod.yml
    # listen 443 ssl;
    # http2 on;
    server_name legoblokk.ru www.legoblokk.ru _;

    # ssl_certificate /etc/letsencrypt/live/legoblokk.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/legoblokk.ru/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        default_type text/plain;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        try_files /robots.txt =404;
    }

    location /essence/graphql {
        auth_basic "Essence";
        auth_basic_user_file /etc/nginx/.htpasswd;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        set $backend_upstream http://backend:4000/graphql;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location /essence {
        auth_basic "Essence";
        auth_basic_user_file /etc/nginx/.htpasswd;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;

        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
