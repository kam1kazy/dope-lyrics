schema: spec-driven

context: |
  Dope Lyrics — личный каталог фраз из Telegram: парсинг чата → Postgres → экран
  (рандом / карусель / караоке). Потом фильтры и ИИ на своём корпусе.

  Стек: Bun, Elysia + GraphQL Yoga, Prisma + PostgreSQL, Next.js 14, Apollo,
  mtcute. Новый UI — shadcn; весь Chakra уходит в дорожке C, не в A. Корень — client/ и server/.

  Документация — это бэклог (Jira нет). Новый чат читает `docs/00_vision.md`.
  - `docs/tasks/` — текущие задачи
  - `guide/` — косметика GitHub, не редактировать без просьбы
  - `openspec/` — спеки фич, слаг kebab-case, не ключ тикета

  Git: база `main`. `origin/develop` впереди (~62 коммита, auth/JWT) — склад, не мержить целиком.
  Ветки `feat/…` и `fix/…` от main. Коммиты и артефакты — по-русски.
  Не коммитить и не пушить без явной просьбы. «Закоммить» ≠ push.
  Без Co-authored-by: Cursor. Без force-push в main.

  Локаль: контейнер `postgres` на 5432 — youways, не сносить.
  База проекта — отдельная БД или контейнер на другом порту.
  Прод-compose (nginx, SSL, Docker Hub) локально не поднимать.

  Telegram: историю читает user-сеанс (телефон + 2FA), не бот.
  Домен нужен только для Mini App и бота без включённого компа.
  Секреты (.env, BOT_TOKEN, API_HASH, сессии bot-data) не читать и не печатать.

  Auth/сессии и защита хоста — с youways, не с origin/develop. Тулчейн: eslint, prettier, fix, TS 7.
  UI сейчас прототип. Не полировать как финальный дизайн.
  Новый код без `any`. Ошибки в UI по-русски.

rules:
  proposal:
    - "Слаг без Jira: kebab-case по смыслу"
    - "Non-goals обязательны"
    - "Не трогать guide/ и не тащить сервер/домен, если задача про локаль"
  specs:
    - "Given/When/Then"
    - "Фиксировать наблюдаемое поведение, не внутренний рефакторинг"
  design:
    - "Ссылаться на существующие файлы (mtcute, Prisma, GraphQL, LyricList), не изобретать слой на будущее"
    - "Если нужен Telegram — явно: только GraphQL vs user-сеанс vs Mini App"
  tasks:
    - "Задачи привязаны к конкретным файлам"
    - "Отдельный пункт, если меняется схема Prisma или контракт GraphQL"

operations:
  apply:
    guidance:
      - "Реализовывать только tasks текущего change"
      - "Не коммитить, пока пользователь не попросил"
      - "Не редактировать guide/"
  archive:
    guidance:
      - "Кратко: что влилось в openspec/specs и какой change ушёл в archive"
      - "Обновить docs/status.md, если изменилось состояние проекта"
      - "Если экран стал другим — сразу апнуть MINOR (docs/versions.md), не спрашивать"
